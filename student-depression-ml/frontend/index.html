<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='%233F6844'%3E%3Cpath d='M12 2C8 6 5 10 5 14a7 7 0 0 0 14 0c0-4-3-8-7-12z'/%3E%3C/svg%3E" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Quicksand:wght@500;600;700&family=Inter:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
    <title>Serenity — Prends un moment pour toi</title>
    <script>
      // Set the theme before the app mounts to avoid a flash of the wrong
      // theme. Kept in sync with ThemeContext's storage key/default.
      (function () {
        var stored = localStorage.getItem("serenity-theme");
        document.documentElement.dataset.theme = stored === "dark" ? "dark" : "light";
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
